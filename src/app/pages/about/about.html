<h1>Про бібліотеку</h1>
<p>
  «Онлайн-бібліотека» — це навчальний проєкт, створений для демонстрації
  можливостей маршрутизації в Angular. Мета сервісу — надати користувачам
  зручний доступ до каталогу книг: переглядати список видань та детальну
  інформацію про кожну книгу — автора, назву та кількість сторінок.
</p>
